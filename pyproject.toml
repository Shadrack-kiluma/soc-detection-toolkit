[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-detection-toolkit"
version = "1.0.0"
description = "An explainable defensive authentication log detection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SOC Detection Toolkit contributors"}]
keywords = ["security", "blue-team", "soc", "detection-engineering", "log-analysis"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []

[project.scripts]
socdetect = "socdetect.cli:main"

[tool.setuptools]
packages = ["socdetect"]
